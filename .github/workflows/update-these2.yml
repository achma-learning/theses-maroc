# Weekly check of https://wd.fmpm.uca.ma/biblio/theses/Accueil.html (+ lib.fmpm.uca.ma for jury).
#
# update_theses.py rebuilds the dataset from the sources and compares it with these2/data/theses.json:
# identical -> "changed=false", the data file is untouched and the charts are NOT redrawn.
# Different -> new JSON + matplotlib charts in these2/.
# these2/data/status.json (date of the last check) is committed every week: the site shows
# "vérifié le …", and the commit counts as repo activity so GitHub never disables this schedule.
# The commit is a push to main -> pages.yml republishes the site.
#
# Faculty server blocking GitHub's runners? Export the CSV with the FMPM userscript
# (userscripts/v0-stable.js, "Exporter CSV brut") and commit it as pipeline/official-export.csv.
name: Update These2.0 data

on:
  schedule:
    - cron: "17 4 * * 1" # every Monday, 04:17 UTC
  workflow_dispatch:
    inputs:
      redraw_charts:
        description: "Redraw the charts even if the data did not change"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # lets this job start pages.yml (pushes made with GITHUB_TOKEN do not)

concurrency:
  group: update-these2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/scripts/requirements.txt

      - run: pip install -r pipeline/scripts/requirements.txt

      - name: Check the sources, rebuild the data if they changed
        id: data
        run: python pipeline/scripts/update_theses.py --json these2/data/theses.json

      - name: Draw dashboard (matplotlib)
        if: steps.data.outputs.changed == 'true' || inputs.redraw_charts
        run: python pipeline/scripts/build_charts.py --json these2/data/theses.json --out these2/stats

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add these2/data these2/stats
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          elif [ "${{ steps.data.outputs.changed }}" = "true" ]; then
            git commit -m "data: official site changed, refresh $(date -u +%F)" && git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: weekly check $(date -u +%F), no change" && git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Republish the site
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
