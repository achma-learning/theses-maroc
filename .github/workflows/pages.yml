# Publishes the whole repo root (index.html = archive search, these2/ = These2.0 FMPM, visuals/ = charts) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Files ignored on the site: big CSV zips etc. are not needed, so only the folders the pages read are copied.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep only what the pages read
        run: |
          mkdir _site
          cp index.html _site/
          cp -r these2 visuals archive userscripts _site/
          find _site/archive \( -name '*.zip' -o -name '*-backup.csv' -o -name '*.py' \) -delete
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
